openapi: 3.1.0
info:
  title: SmartHire Identity API
  version: 0.1.0
  description: Browser-facing contracts implemented only by web/src/app/api/**/route.ts in the modular full-stack Next.js application. Better Auth owns the single opaque PostgreSQL-backed browser session and its only authentication cookie. All errors/logs omit secrets; state-changing browser writes require same-origin validation. Recovery proofs arrive only in URL fragments and may be POSTed only to the read-only capability exchange; mutation endpoints require the resulting encrypted HttpOnly capability cookie.
servers:
  - url: https://{configured-origin}
paths:
  /api/identity/register:
    post:
      operationId: register
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/GenericAccepted'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {description: The normalized email is already registered, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message, fields], properties: {message: {type: string, const: An account with this email already exists.}, fields: {type: object, required: [email], properties: {email: {type: array, items: {type: string}}}}}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/identity/verification/consume:
    post:
      operationId: verifyEmail
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRequest'}}}}
      responses:
        '200': {description: Verification succeeded, content: {application/json: {schema: {$ref: '#/components/schemas/Outcome'}}}}
        '400': {$ref: '#/components/responses/GenericFailure'}
  /api/identity/verification/resend:
    post:
      operationId: resendVerification
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/PasswordResetQueued'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/ActiveAccountNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/RequestUnavailable'}
  /api/identity/login:
    post:
      operationId: loginPassword
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200':
          description: Better Auth authentication completed with its sole session cookie, or a restricted AuthenticationChallenge was created without a Session.
          headers: {Set-Cookie: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LoginOutcome'}}}
        '401': {$ref: '#/components/responses/LoginCredentialFailure'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/identity/two-factor/complete:
    post:
      operationId: completeSecondFactor
      security: [{preAuthCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecondFactorRequest'}}}}
      responses:
        '200':
          description: Better Auth completed the second factor, created its sole authoritative Session/cookie, and cleared the non-authenticating challenge cookie.
          headers: {Set-Cookie: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Outcome'}}}
        '401': {$ref: '#/components/responses/GenericAuthFailure'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/identity/two-factor/enrollment:
    post:
      operationId: startTotpEnrollment
      security: [{sessionCookie: [], csrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordProof'}}}}
      responses:
        '200': {description: One-time setup secret response; must not be cached or persisted client-side, content: {application/json: {schema: {$ref: '#/components/schemas/TotpSetup'}}}}
        '401': {$ref: '#/components/responses/RecentAuthRequired'}
  /api/identity/two-factor/enrollment/verify:
    post:
      operationId: verifyTotpEnrollment
      security: [{sessionCookie: [], csrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TotpCodeRequest'}}}}
      responses:
        '200': {description: 2FA enabled; backup codes returned once; any Better Auth replacement session cookie is forwarded, headers: {Cache-Control: {schema: {type: string, const: no-store}}, Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/BackupCodesOnce'}}}}
        '400': {$ref: '#/components/responses/GenericFailure'}
  /api/identity/two-factor/disable:
    post:
      operationId: disableTotp
      security: [{sessionCookie: [], csrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DisableTwoFactorRequest'}}}}
      responses:
        '200': {description: Disabled through Better Auth; any rotated authoritative session cookie is forwarded, headers: {Cache-Control: {schema: {type: string, const: no-store}}, Set-Cookie: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/RecentAuthRequired'}
  /api/identity/two-factor/backup-codes/regenerate:
    post:
      operationId: regenerateBackupCodes
      security: [{sessionCookie: [], csrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TwoFactorManagementRequest'}}}}
      responses:
        '200': {description: Previous set invalidated; new codes returned once, content: {application/json: {schema: {$ref: '#/components/schemas/BackupCodesOnce'}}}}
        '401': {$ref: '#/components/responses/RecentAuthRequired'}
  /api/identity/password/forgot:
    post:
      operationId: forgotPassword
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/GenericAccepted'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/identity/password/reset:
    post:
      operationId: resetPassword
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
      responses:
        '200': {description: Password changed through the idempotent reset saga; all sessions and authentication challenges revoked; TOTP and unused backup codes preserved; normal login with the existing second factor required}
        '400': {$ref: '#/components/responses/GenericFailure'}
        '503': {$ref: '#/components/responses/ResetIncomplete'}
  /api/identity/account-recovery/request:
    post:
      operationId: requestFullAccountRecovery
      security: []
      description: Eligibility-aware request; verified 2FA accounts receive full-recovery confirmation, while active accounts without 2FA receive the normal password-reset email. Unknown or inactive accounts return a distinct error.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/AccountRecoveryInstructionsQueued'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/EligibleRecoveryAccountNotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/RequestUnavailable'}
  /api/identity/account-recovery/capability:
    post:
      operationId: authorizeAccountRecoveryRoute
      security: []
      description: Exchanges a valid fragment-carried one-time proof for a five-minute encrypted HttpOnly, SameSite=Strict, route-scoped capability cookie. This read-only gate never mutates account state and never returns the proof.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCapabilityRequest'}}}}
      responses:
        '200': {description: A short-lived route capability was issued}
        '400': {$ref: '#/components/responses/GenericFailure'}
        '403': {$ref: '#/components/responses/GenericFailure'}
  /api/identity/account-recovery/confirm:
    post:
      operationId: confirmFullAccountRecovery
      security: [{recoveryCapabilityCookie: []}]
      description: Consuming the server-validated proof held in the short-lived capability cookie starts one 24-hour hold, revokes sessions/challenges, and queues one-time completion and cancellation links. Link navigation alone never changes account state.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyActionRequest'}}}}
      responses:
        '202': {description: Confirmation accepted; the 24-hour hold is active and login is blocked, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryHoldOutcome'}}}}
        '400': {$ref: '#/components/responses/GenericFailure'}
        '403': {$ref: '#/components/responses/GenericFailure'}
  /api/identity/account-recovery/cancel:
    post:
      operationId: cancelFullAccountRecovery
      security: [{recoveryCapabilityCookie: []}]
      description: The cancellation proof in a valid capability cookie is single-use and may cancel an incomplete recovery operation before the hold ends. An explicit user action is required.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyActionRequest'}}}}
      responses:
        '200': {description: Cancellation processed without disclosing account state, content: {application/json: {schema: {$ref: '#/components/schemas/Outcome'}}}}
        '400': {$ref: '#/components/responses/GenericFailure'}
        '403': {$ref: '#/components/responses/GenericFailure'}
  /api/identity/account-recovery/complete:
    post:
      operationId: completeFullAccountRecovery
      security: [{recoveryCapabilityCookie: []}]
      description: Deferred MVP contract. Completion is allowed only after the 24-hour hold; it changes the Better Auth password and disables old TOTP and backup codes only in this full-recovery completion step, then requires a new login.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteRecoveryRequest'}}}}
      responses:
        '200': {description: Full recovery completed; old 2FA disabled, sessions/challenges revoked, notification/audit durable, and no automatic login}
        '400': {$ref: '#/components/responses/GenericFailure'}
        '403': {$ref: '#/components/responses/GenericFailure'}
        '409': {$ref: '#/components/responses/RecoveryHoldActive'}
  /api/identity/logout:
    post:
      operationId: logout
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '200': {description: Current authoritative session revoked and cookie cleared}
  /api/identity/sessions:
    get:
      operationId: listSessions
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Sanitized owned sessions plus an ephemeral CSRF proof, content: {application/json: {schema: {$ref: '#/components/schemas/SessionListOutcome'}}}}
  /api/identity/sessions/{sessionReference}:
    delete:
      operationId: revokeSession
      security: [{sessionCookie: [], csrfToken: []}]
      parameters:
        - {name: sessionReference, in: path, required: true, schema: {type: string, minLength: 20, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}}
      responses:
        '200': {description: Session revocation request processed without disclosing whether the reference existed or was owned}
        '400': {description: Malformed opaque session reference}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: __Host-smarthire.session, description: 'Production Better Auth opaque session cookie: Secure=true; HttpOnly=true; SameSite=Lax; Path=/; no Domain. Development without HTTPS uses unprefixed smarthire.session with Secure=false; it never uses the __Host- prefix.'}
    preAuthCookie: {type: apiKey, in: cookie, name: __Secure-smarthire.pre-auth, description: 'Production non-authenticating challenge handle: Secure=true; HttpOnly=true; SameSite=Lax; Path=/api/identity/two-factor/complete. Development without HTTPS uses unprefixed smarthire.pre-auth with Secure=false; it never uses the __Secure- prefix.'}
    recoveryCapabilityCookie: {type: apiKey, in: cookie, name: __Secure-smarthire.recovery-capability, description: 'Five-minute encrypted non-session capability: Secure=true; HttpOnly=true; SameSite=Strict; Path=/api/identity/account-recovery; no Domain. Development HTTP uses the unprefixed smarthire.recovery-capability cookie.'}
    csrfToken: {type: apiKey, in: header, name: X-CSRF-Token}
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, passwordConfirmation]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        passwordConfirmation: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    EmailRequest: {type: object, additionalProperties: false, required: [email], properties: {email: {type: string, format: email, maxLength: 320}}}
    LoginRequest: {type: object, additionalProperties: false, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, writeOnly: true}, returnTo: {type: string, maxLength: 2048, writeOnly: true}}}
    TokenRequest: {type: object, additionalProperties: false, required: [token], properties: {token: {type: string, minLength: 32, maxLength: 1024, writeOnly: true}}}
    PasswordProof: {type: object, additionalProperties: false, required: [currentPassword], properties: {currentPassword: {type: string, writeOnly: true}}}
    TotpCodeRequest: {type: object, additionalProperties: false, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}}}
    SecondFactorRequest:
      oneOf:
        - {type: object, additionalProperties: false, required: [factor, code], properties: {factor: {const: totp}, code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}}}
        - {type: object, additionalProperties: false, required: [factor, code], properties: {factor: {const: backup-code}, code: {type: string, minLength: 8, maxLength: 128, writeOnly: true}}}
    DisableTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword: {type: string, writeOnly: true}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    TwoFactorManagementRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword: {type: string, writeOnly: true}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    ResetPasswordRequest: {type: object, additionalProperties: false, required: [token, newPassword, confirmPassword], properties: {token: {type: string, writeOnly: true}, newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}, confirmPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}}}
    RecoveryCapabilityRequest: {type: object, additionalProperties: false, required: [kind, proof], properties: {kind: {type: string, enum: [confirmation, cancellation, completion]}, proof: {type: string, minLength: 32, maxLength: 512, writeOnly: true}}}
    EmptyActionRequest: {type: object, additionalProperties: false}
    CompleteRecoveryRequest:
      type: object
      additionalProperties: false
      required: [newPassword, confirmPassword]
      properties:
        newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        confirmPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    LoginOutcome:
      type: object
      additionalProperties: false
      required: [message, requiresTwoFactor]
      properties:
        message: {type: string}
        requiresTwoFactor: {type: boolean}
    Outcome: {type: object, required: [status], properties: {status: {enum: [success, failure]}}}
    TotpSetup: {type: object, required: [qrCodeDataUrl, manualKey], properties: {qrCodeDataUrl: {type: string, writeOnly: true}, manualKey: {type: string, writeOnly: true}}}
    BackupCodesOnce: {type: object, required: [backupCodes], properties: {backupCodes: {type: array, minItems: 10, maxItems: 10, items: {type: string, writeOnly: true}}}}
    SessionSummary:
      type: object
      additionalProperties: false
      required: [reference, current, lastActiveAt, expiresAt, device, approximateLocation]
      properties:
        reference: {type: string, minLength: 20, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        current: {type: boolean}
        lastActiveAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        device: {type: string, maxLength: 100}
        approximateLocation: {type: string, maxLength: 80}
    SessionListOutcome:
      type: object
      additionalProperties: false
      required: [sessions, csrfProof]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/SessionSummary'}}
        csrfProof: {type: string, writeOnly: true}
    RecoveryHoldOutcome:
      type: object
      additionalProperties: false
      required: [status, holdEndsAt, lowerAssuranceNotice, message]
      properties:
        status: {const: hold-active}
        holdEndsAt: {type: string, format: date-time}
        lowerAssuranceNotice: {type: string}
        message: {type: string}
  responses:
    GenericAccepted: {description: Accepted request response containing a safe user-facing message, content: {application/json: {schema: {type: object, required: [message], properties: {message: {type: string}}}}}}
    PasswordResetQueued: {description: An active account matched and one password-reset instruction email was queued, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, const: Password-reset instructions will be sent to this email.}}}}}}
    ActiveAccountNotFound: {description: No active account matched the normalized email, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, const: No active account was found for this email.}}}}}}
    AccountRecoveryInstructionsQueued: {description: A recovery email was queued; active 2FA accounts receive full recovery and active accounts without 2FA receive normal password reset, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, enum: [Account-recovery instructions will be sent to this email., Password-reset instructions will be sent to this email.]}}}}}}
    EligibleRecoveryAccountNotFound: {description: No active account matched the normalized email, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, const: No active account was found for this email.}}}}}}
    RequestUnavailable: {description: The request could not be completed because persistence was unavailable; no success is claimed}
    ValidationError: {description: Field-safe validation errors; no account-existence information}
    GenericFailure: {description: Generic invalid/expired/used failure without secret echo}
    LoginCredentialFailure: {description: Generic credential failure that does not disclose whether the normalized email exists, content: {application/json: {schema: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, const: Email or password is incorrect.}}}}}}
    GenericAuthFailure: {description: Generic authentication failure}
    RecentAuthRequired: {description: Recent authentication/current proof required}
    RateLimited: {description: Generic retry-later response, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}}
    ResetIncomplete: {description: Generic fail-closed reset response; the durable reset operation remains retryable, and login stays blocked until mandatory cleanup and finalization complete}
    RecoveryHoldActive: {description: Generic response indicating that the 24-hour security hold has not elapsed; no password or factor state is changed}
