openapi: 3.1.0
info:
  title: SmartHire Submitted Candidates API — Group 1
  version: 1.1.0
  description: Existing candidate submission extension plus job-scoped recruiter list and authorized original-document access. No scoring operations.
paths:
  /api/jobs/{jobId}/applications:
    post:
      operationId: submitOwnApplication
      description: Extends the existing submission operation; creates one APPLIED JobApplication with immutable evidence and content-minimized audit. This is not a second submission endpoint.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationSubmission' }
      responses:
        '201':
          description: New authoritative APPLIED application committed atomically
          content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationOutcome' } } }
        '200':
          description: Exact idempotent replay of the authoritative application
          content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationOutcome' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409':
          description: Duplicate/conflicting idempotency or submission changed before commit
          content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } }
  /api/recruiter/jobs/{jobId}/applications:
    get:
      operationId: listSubmittedCandidates
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Stable submitted-candidate page ordered by submittedAt and applicationId descending
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/recruiter/jobs/{jobId}/applications/{applicationId}/documents/{kind}:
    get:
      operationId: previewApplicationDocument
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/DocumentKind'
      responses:
        '200':
          description: Inline PDF bytes or cover-letter plain text after current authorization
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, contentEncoding: binary } }
            text/plain: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409':
          description: Valid document exists but inline preview is unsupported or temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeError' }
  /api/recruiter/jobs/{jobId}/applications/{applicationId}/documents/{kind}/download:
    get:
      operationId: downloadApplicationDocument
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/DocumentKind'
      responses:
        '200':
          description: Original authorized application document as an attachment
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, contentEncoding: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, contentEncoding: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-smarthire.session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DocumentKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [cv, cover-letter] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [cvId, coverLetter]
      properties:
        cvId: { type: string, minLength: 1, maxLength: 128 }
        sharedPhone: { type: [string, 'null'], maxLength: 32 }
        coverLetter:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties: { kind: { const: NONE } }
            - type: object
              additionalProperties: false
              required: [kind, text]
              properties:
                kind: { const: TEXT }
                text: { type: string, minLength: 1, maxLength: 10000 }
            - type: object
              additionalProperties: false
              required: [kind, validatedDocumentId]
              properties:
                kind: { const: FILE }
                validatedDocumentId: { type: string, minLength: 1, maxLength: 128 }
    ApplicationOutcome:
      type: object
      additionalProperties: false
      required: [applicationId, jobId, stage, stageVersion, submittedAt, created]
      properties:
        applicationId: { type: string, minLength: 1, maxLength: 128 }
        jobId: { type: string, minLength: 1, maxLength: 128 }
        stage: { const: APPLIED }
        stageVersion: { type: integer, const: 1 }
        submittedAt: { type: string, format: date-time }
        created: { type: boolean }
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SubmittedCandidate' }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
    SubmittedCandidate:
      type: object
      additionalProperties: false
      required: [applicationId, candidate, submittedAt, cv, coverLetter]
      properties:
        applicationId: { type: string, minLength: 1, maxLength: 128 }
        candidate: { $ref: '#/components/schemas/CandidateSummary' }
        submittedAt: { type: string, format: date-time }
        cv: { $ref: '#/components/schemas/DocumentSummary' }
        coverLetter: { $ref: '#/components/schemas/CoverLetterSummary' }
    CandidateSummary:
      type: object
      additionalProperties: false
      required: [displayName, verifiedEmail, sharedPhone]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        verifiedEmail: { type: string, format: email, maxLength: 320 }
        sharedPhone: { type: [string, 'null'], maxLength: 32 }
        avatarUrl:
          type: [string, 'null']
          description: Existing authenticated recruiter-permitted avatar projection only; null requires labelled fallback.
    DocumentSummary:
      type: object
      additionalProperties: false
      required: [available, mediaType, previewSupported]
      properties:
        available: { type: boolean }
        mediaType: { type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
        previewSupported: { type: boolean }
    CoverLetterSummary:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { const: NONE } }
        - type: object
          additionalProperties: false
          required: [kind, available, previewSupported]
          properties:
            kind: { type: string, enum: [TEXT, PDF, DOCX] }
            available: { type: boolean }
            previewSupported: { type: boolean }
    SafeError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, UNAVAILABLE, PREVIEW_UNAVAILABLE, DOCUMENT_UNAVAILABLE, APPLICATION_CONFLICT] }
        message: { type: string, maxLength: 200 }
  responses:
    InvalidRequest:
      description: Invalid bounded input
      content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } }
    Unauthenticated:
      description: No valid current session
      content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } }
    Unavailable:
      description: Neutral unavailable result for unknown or unauthorized resources
      content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } }
