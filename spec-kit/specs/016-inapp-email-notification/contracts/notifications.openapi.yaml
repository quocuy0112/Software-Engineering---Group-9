openapi: 3.1.0
info:
  title: SmartHire In-App Notification API
  version: 1.0.0
  description: Recipient-scoped authenticated contracts for Feature 016.
servers:
  - url: /
paths:
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List notifications owned by the authenticated user
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: state
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/NotificationCategory'
      responses:
        '200':
          description: Recipient-owned notification page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      summary: Get the authenticated user's unread count
      responses:
        '200':
          description: Unread count capped only for display by the client
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unreadCount, observedAt]
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
                  observedAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      summary: Idempotently mark one owned notification read
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csrfProof]
              properties:
                csrfProof:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        '200':
          description: Read-state result; repeated requests return the same state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadMutationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
  /api/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Idempotently mark all non-expired owned notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csrfProof]
              properties:
                csrfProof:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        '200':
          description: Number changed by this request and resulting unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadMutationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/notifications/contexts/read:
    post:
      operationId: markNotificationContextRead
      summary: Mark matching owned notifications read after protected content loads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contextType, contextId, csrfProof]
              properties:
                contextType:
                  $ref: '#/components/schemas/NotificationContextType'
                contextId:
                  type: string
                  minLength: 1
                  maxLength: 128
                csrfProof:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        '200':
          description: Context read result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadMutationResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    NotificationCategory:
      type: string
      enum: [SECURITY, ACCOUNT, APPLICATION, VERIFICATION, SUPPORT, CONNECTION, MESSAGING, MODERATION, SYSTEM]
    NotificationSeverity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    NotificationContextType:
      type: string
      enum: [ACCOUNT, MEMBERSHIP, APPLICATION, VERIFICATION_REQUEST, SUPPORT_CASE, CONNECTION_PROPOSAL, CONNECTION, CONVERSATION, MESSAGING_REPORT]
    NotificationItem:
      type: object
      additionalProperties: false
      required: [id, kind, category, severity, title, summary, readAt, createdAt, expiresAt]
      properties:
        id:
          type: string
        kind:
          type: string
        category:
          $ref: '#/components/schemas/NotificationCategory'
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
        title:
          type: string
          maxLength: 120
        summary:
          type: string
          maxLength: 500
        href:
          type: [string, 'null']
          maxLength: 500
        contextType:
          oneOf:
            - $ref: '#/components/schemas/NotificationContextType'
            - type: 'null'
        contextId:
          type: [string, 'null']
          maxLength: 128
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unreadCount, observedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        nextCursor:
          type: [string, 'null']
        unreadCount:
          type: integer
          minimum: 0
        observedAt:
          type: string
          format: date-time
    ReadMutationResult:
      type: object
      additionalProperties: false
      required: [changedCount, unreadCount, observedAt]
      properties:
        changedCount:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
        observedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [AUTH_REQUIRED, FORBIDDEN, INVALID_REQUEST, NOTIFICATION_UNAVAILABLE, INTERNAL_FAILURE]
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF or authority check failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Notification is missing or not owned by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
