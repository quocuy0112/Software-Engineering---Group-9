openapi: 3.1.0
info:
  title: SmartHire Feature 009 Admin User and Verification API Delta
  version: 0.1.0
  description: >-
    Delta over Feature 006 admin-api.openapi.yaml for the account directory,
    recruiter verification approval, and account suspension/restoration flows.
    The existing Better Auth cookie, admin-origin, CSRF, step-up, idempotency,
    audit, evidence-capability, and error-envelope contracts remain authoritative.
servers:
  - url: http://console.admin.localhost:3001
    description: Local administration origin
tags:
  - name: AccountDirectory
  - name: AccountModeration
  - name: RecruiterVerification
x-removed-paths:
  - path: /api/admin/accounts/{accountId}/reinstate
    methods: [post]
    reason: Feature 009 standardizes the current command and UI term as Restore.
  - path: /api/admin/verification-requests/{requestId}/request-changes
    methods: [post]
    reason: Feature 009 permits only Approve or Reject as current Admin decisions.
paths:
  /api/admin/accounts:
    get:
      tags: [AccountDirectory]
      operationId: listManagedAccounts
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Keyword" }
        - { $ref: "#/components/parameters/AccountType" }
        - { $ref: "#/components/parameters/AccountStatus" }
        - { $ref: "#/components/parameters/RegisteredFrom" }
        - { $ref: "#/components/parameters/RegisteredTo" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Stable newest-registration-first page with current aggregates
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDirectoryPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
  /api/admin/accounts/{accountId}:
    get:
      tags: [AccountDirectory]
      operationId: getManagedAccount
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Type-aware account detail and moderation eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDetail" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/accounts/{accountId}/suspend:
    post:
      tags: [AccountModeration]
      operationId: suspendManagedAccount
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationCommand" }
      responses:
        "200":
          description: Account suspended; sessions revoked and mandatory email queued atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCommandResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "423": { $ref: "#/components/responses/ProtectedAdministrator" }
  /api/admin/accounts/{accountId}/restore:
    post:
      tags: [AccountModeration]
      operationId: restoreManagedAccount
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationCommand" }
      responses:
        "200":
          description: Account restored without creating a session; mandatory email queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCommandResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "423": { $ref: "#/components/responses/ProtectedAdministrator" }
  /api/admin/verification-requests:
    get:
      tags: [RecruiterVerification]
      operationId: listRecruiterVerificationReviews
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/VerificationState" }
        - { $ref: "#/components/parameters/ApplicantEligibility" }
        - { $ref: "#/components/parameters/CompanyKeyword" }
        - { $ref: "#/components/parameters/ExactTaxCode" }
        - { $ref: "#/components/parameters/SubmittedFrom" }
        - { $ref: "#/components/parameters/SubmittedTo" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Oldest-first verification review queue without evidence locators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationQueuePage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
  /api/admin/verification-requests/{requestId}:
    get:
      tags: [RecruiterVerification]
      operationId: getRecruiterVerificationReview
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: Review detail with safe evidence metadata and decision eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationReviewDetail" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/verification-requests/{requestId}/evidence/{evidenceId}/preview:
    get:
      tags: [RecruiterVerification]
      operationId: previewRecruiterVerificationEvidence
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      responses:
        "200":
          description: Protected inline image/PDF byte stream after current capability checks
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            Content-Security-Policy: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            application/pdf: { schema: { type: string, contentEncoding: binary } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/EvidenceUnavailable" }
  /api/admin/verification-requests/{requestId}/approve:
    post:
      tags: [RecruiterVerification]
      operationId: approveRecruiterVerification
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveVerificationCommand" }
      responses:
        "200":
          description: Verification approved and recruiter authority granted atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationDecisionResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "423": { $ref: "#/components/responses/ApplicantSuspended" }
  /api/admin/verification-requests/{requestId}/reject:
    post:
      tags: [RecruiterVerification]
      operationId: rejectRecruiterVerification
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectVerificationCommand" }
      responses:
        "200":
          description: Verification rejected with applicant-visible reason and email queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationDecisionResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthorityDenied" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "423": { $ref: "#/components/responses/ApplicantSuspended" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: smarthire.session
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    Keyword: { name: q, in: query, schema: { type: string, maxLength: 160 } }
    AccountType: { name: type, in: query, schema: { enum: [ALL, CANDIDATE, RECRUITER], default: ALL } }
    AccountStatus: { name: status, in: query, schema: { enum: [ALL, ACTIVE, SUSPENDED], default: ALL } }
    RegisteredFrom: { name: registeredFrom, in: query, schema: { type: string, format: date } }
    RegisteredTo: { name: registeredTo, in: query, schema: { type: string, format: date } }
    VerificationState: { name: state, in: query, schema: { enum: [PENDING_REVIEW, APPROVED, REJECTED, CHANGES_REQUESTED, RESUBMITTED, CANCELLED, EXPIRED], default: PENDING_REVIEW } }
    ApplicantEligibility: { name: applicantEligibility, in: query, schema: { enum: [ACTIVE_ONLY, SUSPENDED_ONLY, ANY], default: ACTIVE_ONLY } }
    CompanyKeyword: { name: company, in: query, schema: { type: string, maxLength: 160 } }
    ExactTaxCode: { name: taxCode, in: query, schema: { type: string, minLength: 10, maxLength: 10, pattern: '^[0-9]{10}$' } }
    SubmittedFrom: { name: submittedFrom, in: query, schema: { type: string, format: date } }
    SubmittedTo: { name: submittedTo, in: query, schema: { type: string, format: date } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, enum: [25, 50, 100], default: 25 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
  schemas:
    AccountDirectoryPage:
      type: object
      additionalProperties: false
      required: [data, page, pageSize, total, calculatedAt]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccountDirectoryItem" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [25, 50, 100] }
        total: { type: integer, minimum: 0 }
        calculatedAt: { type: string, format: date-time }
    AccountDirectoryItem:
      type: object
      additionalProperties: false
      required: [id, accountReference, displayName, maskedEmail, registeredAt, type, status, version, counts]
      properties:
        id: { type: string, format: uuid }
        accountReference: { type: string }
        displayName: { type: string }
        maskedEmail: { type: string }
        registeredAt: { type: string, format: date-time }
        type: { enum: [CANDIDATE, RECRUITER] }
        status: { enum: [ACTIVE, SUSPENDED] }
        version: { type: integer, minimum: 0 }
        counts: { $ref: "#/components/schemas/AccountCounts" }
    AccountCounts:
      oneOf:
        - $ref: "#/components/schemas/CandidateCounts"
        - $ref: "#/components/schemas/RecruiterCounts"
    CandidateCounts:
      type: object
      additionalProperties: false
      required: [kind, cvCount, applicationCount]
      properties:
        kind: { const: CANDIDATE }
        cvCount: { type: integer, minimum: 0 }
        applicationCount: { type: integer, minimum: 0 }
    RecruiterCounts:
      type: object
      additionalProperties: false
      required: [kind, active, pendingReview, rejected, draft, closed]
      properties:
        kind: { const: RECRUITER }
        active: { type: integer, minimum: 0 }
        pendingReview: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }
    AccountDetail:
      type: object
      additionalProperties: false
      required: [account, authorities, moderation, history, calculatedAt]
      properties:
        account: { $ref: "#/components/schemas/AccountDirectoryItem" }
        authorities:
          type: array
          items: { $ref: "#/components/schemas/CompanyAuthority" }
        moderation: { $ref: "#/components/schemas/ModerationEligibility" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ModerationHistoryItem" }
        calculatedAt: { type: string, format: date-time }
    CompanyAuthority:
      type: object
      additionalProperties: false
      required: [companyId, companyName, membershipState, verificationState]
      properties:
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        membershipState: { type: string }
        verificationState: { type: string }
    ModerationEligibility:
      type: object
      additionalProperties: false
      required: [canSuspend, canRestore, protectedAdministrator, reasonCode]
      properties:
        canSuspend: { type: boolean }
        canRestore: { type: boolean }
        protectedAdministrator: { type: boolean }
        reasonCode: { type: [string, "null"] }
    ModerationCommand:
      type: object
      additionalProperties: false
      required: [category, reason]
      properties:
        category: { $ref: '#/components/schemas/ModerationReasonCategory' }
        reason: { type: string, minLength: 10, maxLength: 500 }
    ModerationReasonCategory:
      type: string
      enum: [SECURITY_COMPROMISE, POLICY_VIOLATION, USER_REQUEST, VERIFICATION_FAILURE, INCIDENT_RESOLVED, ACCESS_CLEANUP, OTHER]
    ModerationCommandResult:
      type: object
      additionalProperties: false
      required: [accountId, status, version, correlationId, emailStatus]
      properties:
        accountId: { type: string, format: uuid }
        status: { enum: [ACTIVE, SUSPENDED] }
        version: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        emailStatus: { enum: [QUEUED] }
    ModerationHistoryItem:
      type: object
      additionalProperties: false
      required: [id, action, actorRef, priorState, resultingState, category, result, occurredAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        action: { enum: [SUSPEND, RESTORE] }
        actorRef: { type: string }
        priorState: { enum: [ACTIVE, SUSPENDED] }
        resultingState: { enum: [ACTIVE, SUSPENDED] }
        category: { $ref: '#/components/schemas/ModerationReasonCategory' }
        result: { enum: [SUCCEEDED, DENIED, FAILED] }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
    VerificationQueuePage:
      type: object
      additionalProperties: false
      required: [data, page, pageSize, total, calculatedAt]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/VerificationQueueItem" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [25, 50, 100] }
        total: { type: integer, minimum: 0 }
        calculatedAt: { type: string, format: date-time }
    VerificationQueueItem:
      type: object
      additionalProperties: false
      required: [id, applicantId, companyName, taxCode, state, applicantEligibility, submittedAt, resubmissionCount, version]
      properties:
        id: { type: string, format: uuid }
        applicantId: { type: string, format: uuid }
        companyName: { type: string }
        taxCode: { type: string, minLength: 10, maxLength: 10, pattern: '^[0-9]{10}$' }
        state: { type: string }
        applicantEligibility: { enum: [ACTIVE, SUSPENDED] }
        submittedAt: { type: string, format: date-time }
        resubmissionCount: { type: integer, minimum: 0 }
        assignedAdminRef: { type: [string, "null"] }
        version: { type: integer, minimum: 0 }
    VerificationReviewDetail:
      type: object
      additionalProperties: false
      required: [request, company, evidence, versions, decisions, canDecide, blockReason, calculatedAt]
      properties:
        request: { $ref: "#/components/schemas/VerificationQueueItem" }
        company: { $ref: "#/components/schemas/VerificationCompany" }
        evidence: { $ref: "#/components/schemas/EvidenceMetadata" }
        versions: { type: array, items: { $ref: "#/components/schemas/EvidenceMetadata" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/DecisionHistoryItem" } }
        canDecide: { type: boolean }
        blockReason: { type: [string, "null"] }
        calculatedAt: { type: string, format: date-time }
    VerificationCompany:
      type: object
      additionalProperties: false
      required: [name, taxCode, targetKind, prerequisiteState]
      properties:
        name: { type: string }
        taxCode: { type: string, minLength: 10, maxLength: 10, pattern: '^[0-9]{10}$' }
        targetKind: { enum: [NEW_COMPANY, EXISTING_COMPANY] }
        prerequisiteState: { type: string }
    EvidenceMetadata:
      type: object
      additionalProperties: false
      required: [id, version, fileName, mediaType, byteSize, safetyState, accessibility]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        fileName: { type: string }
        mediaType: { enum: [image/png, image/jpeg, application/pdf] }
        byteSize: { type: integer, minimum: 1 }
        safetyState: { enum: [PENDING, PASS, FAIL, ERROR] }
        accessibility: { enum: [AVAILABLE, INACCESSIBLE, DELETED] }
    DecisionHistoryItem:
      type: object
      additionalProperties: false
      required: [id, decision, decidedAt, reviewerRef]
      properties:
        id: { type: string, format: uuid }
        decision: { enum: [APPROVED, REJECTED, CHANGES_REQUESTED] }
        category: { type: [string, "null"] }
        applicantComment: { type: [string, "null"] }
        decidedAt: { type: string, format: date-time }
        reviewerRef: { type: string }
    ApproveVerificationCommand:
      type: object
      additionalProperties: false
      properties:
        protectedNote: { type: string, maxLength: 2000 }
    RejectVerificationCommand:
      type: object
      additionalProperties: false
      required: [category, applicantComment]
      properties:
        category: { $ref: '#/components/schemas/VerificationRejectionCategory' }
        applicantComment: { type: string, minLength: 10, maxLength: 500 }
        protectedNote: { type: string, maxLength: 2000 }
    VerificationRejectionCategory:
      type: string
      enum: [DOCUMENT_UNREADABLE, TAX_ID_MISMATCH, DOCUMENT_EXPIRED, COMPANY_INFORMATION_MISMATCH, DUPLICATE_OR_CONFLICTING_REQUEST, POLICY_INELIGIBLE, OTHER]
    VerificationNotificationStatus:
      type: string
      enum: [QUEUED]
    VerificationNotificationStatuses:
      type: object
      additionalProperties: false
      required: [email, inApp]
      properties:
        email: { $ref: '#/components/schemas/VerificationNotificationStatus' }
        inApp: { $ref: '#/components/schemas/VerificationNotificationStatus' }
    VerificationDecisionResult:
      type: object
      additionalProperties: false
      required: [requestId, state, version, correlationId, notification]
      properties:
        requestId: { type: string, format: uuid }
        state: { enum: [APPROVED, REJECTED] }
        version: { type: integer, minimum: 1 }
        companyId: { type: [string, "null"], format: uuid }
        correlationId: { type: string, format: uuid }
        notification: { $ref: '#/components/schemas/VerificationNotificationStatuses' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, format: uuid }
        fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    ValidationFailed:
      description: Safe validation failure
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    AuthenticationRequired:
      description: Authentication or fresh proof required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    AuthorityDenied:
      description: Current Platform Administrator authority is absent or revoked
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found or not safely disclosable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    VersionConflict:
      description: Reviewed version or current lifecycle state changed; refetch required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ProtectedAdministrator:
      description: Target currently holds Platform Administrator authority; no account mutation occurred
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ApplicantSuspended:
      description: Applicant account is suspended; verification lifecycle remains unchanged
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    EvidenceUnavailable:
      description: Evidence is no longer accessible or failed current safety checks
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
