openapi: 3.1.0
info:
  title: Recruitment Analytics and Export Contracts
  version: 1.0.0
  description: Role-scoped contracts for Administrator analytics, Employer job performance, candidate exports, and optional activity history.
servers:
  - url: /
security:
  - browserSession: []
paths:
  /api/admin/analytics/overview:
    get:
      summary: Get platform growth trends
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TimeZone'
        - $ref: '#/components/parameters/Grouping'
      responses:
        '200':
          description: Administrator growth report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGrowthReport' }
        '400': { $ref: '#/components/responses/InvalidReportRange' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/admin/analytics/activity:
    get:
      summary: List P2 activity history and aggregates
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TimeZone'
        - name: roles
          in: query
          schema: { type: array, items: { type: string }, maxItems: 8 }
        - name: actions
          in: query
          schema: { type: array, items: { type: string }, maxItems: 16 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Filtered activity page and aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '400': { $ref: '#/components/responses/InvalidReportRange' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/recruiter/analytics/jobs/{jobId}/performance:
    get:
      summary: Get one authorized posting performance report
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TimeZone'
      responses:
        '200':
          description: Job performance and current funnel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPerformanceReport' }
        '400': { $ref: '#/components/responses/InvalidReportRange' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/recruiter/analytics/jobs/{jobId}/exports:
    post:
      summary: Request one candidate-list export
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExportRequest' }
      responses:
        '202':
          description: Export accepted or idempotently resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '400': { $ref: '#/components/responses/InvalidReportRange' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/recruiter/analytics/jobs/{jobId}/exports/{exportId}:
    get:
      summary: Get export generation status
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Current export state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/recruiter/analytics/jobs/{jobId}/exports/{exportId}/download:
    get:
      summary: Download a completed, unexpired, still-authorized export
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Complete CSV or XLSX artifact
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-smarthire-session
      description: Symbolic contract name; the existing Better Auth cookie remains the exclusive session owner.
  parameters:
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    TimeZone:
      name: timeZone
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, example: Asia/Ho_Chi_Minh }
    Grouping:
      name: grouping
      in: query
      required: true
      schema: { type: string, enum: [DAY, WEEK, MONTH] }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    InvalidReportRange:
      description: Invalid range, time zone, grouping, or filters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Unauthenticated, unauthorized, absent, expired, or revoked resources use a neutral unavailable response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ReportMetadata:
      type: object
      additionalProperties: false
      required: [from, to, timeZone, dataCutoff, definitionVersion, analyticsAvailableFrom]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timeZone: { type: string }
        dataCutoff: { type: string, format: date-time }
        definitionVersion: { type: string }
        analyticsAvailableFrom: { type: string, format: date-time }
    MetricRate:
      type: object
      additionalProperties: false
      required: [numerator, denominator, value, availability]
      properties:
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        value: { type: [number, 'null'], minimum: 0 }
        availability: { type: string, enum: [AVAILABLE, NOT_APPLICABLE] }
    AdminGrowthBucket:
      type: object
      additionalProperties: false
      required: [start, end, newRegistrations, activePostingsAtEnd, submittedApplications, distinctSubmittingCandidates, applicationsPerCandidate, applicationSuccessRate]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        newRegistrations: { type: integer, minimum: 0 }
        activePostingsAtEnd: { type: integer, minimum: 0 }
        submittedApplications: { type: integer, minimum: 0 }
        distinctSubmittingCandidates: { type: integer, minimum: 0 }
        applicationsPerCandidate: { $ref: '#/components/schemas/MetricRate' }
        applicationSuccessRate: { $ref: '#/components/schemas/MetricRate' }
    AdminGrowthReport:
      type: object
      additionalProperties: false
      required: [metadata, grouping, buckets]
      properties:
        metadata: { $ref: '#/components/schemas/ReportMetadata' }
        grouping: { type: string, enum: [DAY, WEEK, MONTH] }
        buckets: { type: array, items: { $ref: '#/components/schemas/AdminGrowthBucket' } }
    FunnelStage:
      type: object
      additionalProperties: false
      required: [stage, count, percentage]
      properties:
        stage: { type: string, enum: [APPLIED, VIEWED, SHORTLISTED, INTERVIEWING, OFFERED, HIRED, OFFER_DECLINED, REJECTED, WAITLISTED] }
        count: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
    JobPerformanceReport:
      type: object
      additionalProperties: false
      required: [metadata, job, qualifiedViews, submittedApplications, conversionRate, funnelAsOf, funnel]
      properties:
        metadata: { $ref: '#/components/schemas/ReportMetadata' }
        job:
          type: object
          additionalProperties: false
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
        qualifiedViews: { type: integer, minimum: 0 }
        submittedApplications: { type: integer, minimum: 0 }
        conversionRate: { $ref: '#/components/schemas/MetricRate' }
        funnelAsOf: { type: string, format: date-time }
        funnel: { type: array, minItems: 9, maxItems: 9, items: { $ref: '#/components/schemas/FunnelStage' } }
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [CSV, XLSX] }
    ExportStatus:
      type: object
      additionalProperties: false
      required: [id, jobId, format, status, requestedAt, dataCutoff]
      properties:
        id: { type: string }
        jobId: { type: string }
        format: { type: string, enum: [CSV, XLSX] }
        status: { type: string, enum: [QUEUED, PROCESSING, SUCCEEDED, FAILED, EXPIRED] }
        requestedAt: { type: string, format: date-time }
        dataCutoff: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        rowCount: { type: [integer, 'null'], minimum: 0 }
        failureCode: { type: [string, 'null'] }
        downloadAvailable: { type: boolean }
    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, occurredAt, action, result, actor, target]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        action: { type: string }
        result: { type: string, enum: [SUCCESS, FAILURE, DENIED] }
        role: { type: [string, 'null'] }
        actor: { type: string }
        target: { type: string }
    ActivityReport:
      type: object
      additionalProperties: false
      required: [metadata, items, nextCursor, aggregates]
      properties:
        metadata: { $ref: '#/components/schemas/ReportMetadata' }
        items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
        nextCursor: { type: [string, 'null'] }
        aggregates:
          type: object
          additionalProperties: false
          required: [postingsCreated, applicationsSubmitted]
          properties:
            postingsCreated: { type: integer, minimum: 0 }
            applicationsSubmitted: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
