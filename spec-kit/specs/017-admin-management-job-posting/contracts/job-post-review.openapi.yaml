openapi: 3.1.0
info:
  title: SmartHire Administrator Job-Post Review API
  version: 1.0.0
  description: Protected Recruiter submission and Platform Administrator review contracts for JSON-backed job content.
servers:
  - url: /
security:
  - browserSession: []
paths:
  /api/recruiter/job-postings/{jobId}/submit-review:
    post:
      operationId: submitJobPostReview
      summary: Submit the current authorized JSON working job as an immutable review version.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewCommand'
      responses:
        '201':
          description: New pending review created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterReviewProjection'
        '200':
          description: Idempotent replay of the existing pending version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterReviewProjection'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/admin/job-post-reviews:
    get:
      operationId: listJobPostReviews
      summary: List bounded protected job-review queue rows.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: assignment, in: query, schema: { type: string, enum: [ANY, UNASSIGNED, MINE] } }
        - { name: companyId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: minimumAgeHours, in: query, schema: { type: integer, minimum: 0, maximum: 8760 } }
      responses:
        '200':
          description: Paginated review rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, total, calculatedAt]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReviewQueueItem' } }
                  total: { type: integer, minimum: 0 }
                  calculatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/job-post-reviews/{reviewId}:
    get:
      operationId: getJobPostReview
      summary: Read the complete protected review projection.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/admin/job-post-reviews/{reviewId}/{action}:
    post:
      operationId: changeJobPostReview
      summary: Claim, reassign, approve, or reject the expected pending review version.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [claim, reassign, approve, reject] }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewCommand'
      responses:
        '200':
          description: Authoritative command result or idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewCommandResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Existing server-controlled Better Auth session; no second credential is introduced.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    ExpectedVersion:
      name: if-match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    ReviewState:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED]
    ReviewReasonCode:
      type: string
      enum:
        - INCOMPLETE_OR_UNCLEAR
        - MISLEADING_CONTENT
        - COMPENSATION_OR_LOCATION_UNCLEAR
        - DISCRIMINATORY_OR_PROHIBITED
        - COMPANY_OR_ROLE_MISMATCH
        - DUPLICATE_OR_SPAM
        - EXPIRED_OR_INVALID_DEADLINE
        - POLICY_OR_LEGAL_RISK
        - OTHER_ACTION_REQUIRED
    SubmitReviewCommand:
      type: object
      additionalProperties: false
      required: [expectedWorkingUpdatedAt]
      properties:
        expectedWorkingUpdatedAt: { type: string, format: date-time }
    RecruiterReviewProjection:
      type: object
      additionalProperties: false
      required: [reviewId, jobId, sequence, state, readOnly, submittedAt, version]
      properties:
        reviewId: { type: string }
        jobId: { type: string }
        sequence: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ReviewState' }
        readOnly: { type: boolean }
        reasonCode: { oneOf: [{ $ref: '#/components/schemas/ReviewReasonCode' }, { type: 'null' }] }
        publicExplanation: { type: [string, 'null'], maxLength: 1000 }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [id, jobId, companyId, sequence, state, assignment, submittedAt, ageSeconds, version]
      properties:
        id: { type: string }
        jobId: { type: string }
        companyId: { type: string }
        sequence: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ReviewState' }
        assignment: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        ageSeconds: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        integrityState: { type: string, enum: [VALID, BLOCKED] }
    ReviewDetail:
      type: object
      additionalProperties: false
      required: [id, jobId, companyId, sequence, state, assignment, submittedAt, ageSeconds, version, integrityState, snapshot, snapshotSchemaVersion, snapshotSha256, company, submitter, history, privateNotes]
      properties:
        id: { type: string }
        jobId: { type: string }
        companyId: { type: string }
        sequence: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ReviewState' }
        assignment: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        ageSeconds: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        integrityState: { type: string, enum: [VALID, BLOCKED] }
        snapshot: { type: object, additionalProperties: true }
        snapshotSchemaVersion: { type: string }
        snapshotSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        company:
          type: object
          additionalProperties: false
          required: [id, verificationState, active]
          properties:
            id: { type: string }
            verificationState: { type: string }
            active: { type: boolean }
            protectedVerificationHref: { type: [string, 'null'] }
        submitter:
          type: object
          additionalProperties: false
          required: [accountId, membershipState, currentlyEligible]
          properties:
            accountId: { type: string }
            membershipState: { type: string }
            currentlyEligible: { type: boolean }
        priorApprovedSnapshot: { type: [object, 'null'], additionalProperties: true }
        history: { type: array, items: { $ref: '#/components/schemas/ReviewHistoryItem' } }
        privateNotes: { type: array, items: { $ref: '#/components/schemas/PrivateNote' } }
    ReviewHistoryItem:
      type: object
      additionalProperties: false
      required: [id, action, resultingState, resultingVersion, occurredAt]
      properties:
        id: { type: string }
        action: { type: string }
        resultingState: { $ref: '#/components/schemas/ReviewState' }
        resultingVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
    PrivateNote:
      type: object
      additionalProperties: false
      required: [id, authorAdminUserId, normalizedText, createdAt]
      properties:
        id: { type: string }
        authorAdminUserId: { type: string }
        normalizedText: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    AdminReviewCommand:
      oneOf:
        - $ref: '#/components/schemas/ClaimReviewCommand'
        - $ref: '#/components/schemas/ReassignReviewCommand'
        - $ref: '#/components/schemas/ApproveReviewCommand'
        - $ref: '#/components/schemas/RejectReviewCommand'
      discriminator:
        propertyName: command
        mapping:
          CLAIM: '#/components/schemas/ClaimReviewCommand'
          REASSIGN: '#/components/schemas/ReassignReviewCommand'
          APPROVE: '#/components/schemas/ApproveReviewCommand'
          REJECT: '#/components/schemas/RejectReviewCommand'
    ClaimReviewCommand:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: { type: string, const: CLAIM }
    ReassignReviewCommand:
      type: object
      additionalProperties: false
      required: [command, targetAdminUserId]
      properties:
        command: { type: string, const: REASSIGN }
        targetAdminUserId: { type: string, minLength: 1, maxLength: 128 }
    ApproveReviewCommand:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: { type: string, const: APPROVE }
    RejectReviewCommand:
      type: object
      additionalProperties: false
      required: [command, reasonCode, publicExplanation]
      properties:
        command: { type: string, const: REJECT }
        reasonCode: { $ref: '#/components/schemas/ReviewReasonCode' }
        publicExplanation: { type: string, minLength: 20, maxLength: 1000 }
        privateNote: { type: string, minLength: 1, maxLength: 2000 }
    AdminReviewCommandResult:
      type: object
      additionalProperties: false
      required: [reviewId, state, assignedAdminUserId, version, correlationId]
      properties:
        reviewId: { type: string }
        state: { $ref: '#/components/schemas/ReviewState' }
        assignedAdminUserId: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        correlationId: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        currentVersion: { type: integer, minimum: 1 }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
  responses:
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Current authority is insufficient.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unavailable:
      description: Target unavailable without existence disclosure.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Stale, conflicting, already-terminal, or changed idempotency binding.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Strict bounded input validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
