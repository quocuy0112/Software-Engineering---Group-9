# Keep this Linux container configuration LF-only.
LogTime yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 1

LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes

StreamMaxLength 6M
MaxScanSize 6M
MaxFileSize 6M
MaxScanTime 20000
MaxThreads 2
MaxQueue 4
ReadTimeout 20
CommandReadTimeout 5
SendBufTimeout 500
IdleTimeout 30

SelfCheck 600
ConcurrentDatabaseReload no
User clamav
Foreground yes
ExitOnOOM yes
AlertExceedsMax yes
